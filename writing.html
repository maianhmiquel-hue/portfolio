<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALICE MIQUEL</title>
<meta name="description" content="">
<meta property="og:title" content="Writing — Alice Miquel">
<meta property="og:description" content="">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="any">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
<script>try{if(localStorage.getItem('nav')==='open')document.documentElement.classList.add('nav-ouverte')}catch(e){}</script>
</head>

<body>
<div class="armature">

  <!-- ================= COLONNE DE GAUCHE, LE NOM ================= -->
  <header class="flanc">
    <h1 class="nom">
      <a href="index.html"><span>Alice</span><span>Miquel</span></a>
    </h1>
  </header>

  <!-- ================= COLONNE DE DROITE ================= -->
  <div class="corps">

    <div class="rail">
      <nav class="menu" aria-label="Main navigation">
        <button type="button" id="bascule" class="actif" aria-controls="sous-menu" aria-expanded="false">Work</button>
        <a href="about.html">About</a>
      </nav>
      <nav class="menu-second" id="sous-menu" aria-label="Work sections">
        <a href="index.html">Design</a>
        <a href="writing.html" aria-current="page">Writing</a>
        <a href="curating.html">Curating</a>
      </nav>
    </div>

    <main>

      <section class="groupe">

        <div class="grille">

          <!-- Une vignette par texte. Dupliquer le bloc <a class="tuile">,
               changer le href vers la page de fiche et le nom de l'image. -->

          <a class="tuile" href="strange-robots.html">
            <span class="cadre">
              <img src="images/writing-01.jpg" alt="Strange Robots" onerror="this.classList.add('absente')">
              <span class="consigne">Add images/writing-01.jpg</span>
            </span>
          </a>

          <a class="tuile" href="fiche-modele.html">
            <span class="cadre">
              <img src="images/writing-02.jpg" alt="" onerror="this.classList.add('absente')">
              <span class="consigne">Add images/writing-02.jpg</span>
            </span>
          </a>

          <a class="tuile" href="fiche-modele.html">
            <span class="cadre">
              <img src="images/writing-03.jpg" alt="" onerror="this.classList.add('absente')">
              <span class="consigne">Add images/writing-03.jpg</span>
            </span>
          </a>

        </div>

      </section>


    </main>


  </div>

</div>

<script>
(function(){
  var b=document.getElementById('bascule'),h=document.documentElement;
  if(!b)return;
  function sync(){b.setAttribute('aria-expanded',h.classList.contains('nav-ouverte')?'true':'false')}
  sync();
  b.addEventListener('click',function(){
    var ouvert=h.classList.toggle('nav-ouverte');
    try{localStorage.setItem('nav',ouvert?'open':'closed')}catch(e){}
    sync();
  });
})();
</script>
</body>
</html>
